# ============================================================
# EGH450 AUTOPILOT / GUIDANCE CONFIGURATION
# ============================================================


# ------------------------------------------------------------
# Flight Parameters
# ------------------------------------------------------------

flight:
  height: 1.9

  horizontal_speed: 0.5
  vertical_speed: 0.3

  takeoff_speed: 0.2
  landing_speed: 0.2

  yaw_speed: 0.2

  position_tolerance: 0.1
  yaw_tolerance: 0.1


# ------------------------------------------------------------
# ROI / Target Diversion Parameters
# ------------------------------------------------------------

roi:
  payload_height: 0.95

  approach_pause: 1.0
  target_pause: 5.0
  return_pause: 1.0

  payload_timeout: 10.0

  payload_settle_pause: 1.0
  post_payload_pause: 2.0

# ------------------------------------------------------------
# Battery Parameters
# ------------------------------------------------------------

battery:
  warning_percent: 20.0
  landing_percent: 10.0


# ------------------------------------------------------------
# ROS Interfaces
# ------------------------------------------------------------

topics:
  pose: "/mavros/local_position/pose"
  battery: "/mavros/battery"

  roi: "/guidance/roi"
  roi_type: "/guidance/roi_type"
  roi_enable: "/guidance/roi_enable"

  payload_command: "/payload/nav_clearance"
  payload_confirmation: "/payload/deploy_confirmation"

  aruco_log: "/aruco/pose_log"


# ------------------------------------------------------------
# SPAR Interface
# ------------------------------------------------------------

spar:
  action: "/spar/flight"



# ------------------------------------------------------------
# Breadcrumb Path Planning
# ------------------------------------------------------------

navigation:
  breadcrumb_service: "/breadcrumb/request_path"
  service_timeout: 2.0
  use_sparse_path: true



# ------------------------------------------------------------
# Mission Parameters
# ------------------------------------------------------------

mission:
  enable_roi_after_waypoint: 2

  waypoints:

    # ----------------------------------------------------------
    # Initial move from origin to start of search pattern
    # ----------------------------------------------------------

    - [ 0.0,    0.0,    0.0]
    - [-3.6,   -3.000,  0.0]


    # ----------------------------------------------------------
    # Row 1: y = -3.000
    # Left -> Right
    # ----------------------------------------------------------

    - [-2.0,   -3.000,  0.0]
    - [ 0.0,   -3.000,  0.0]
    - [ 2.0,   -3.000,  0.0]
    - [ 3.6,   -3.000,  0.0]


    # ----------------------------------------------------------
    # Row 2: y = -2.375
    # Right -> Left
    # ----------------------------------------------------------

    - [ 3.6,   -2.375,  0.0]
    - [ 2.0,   -2.375,  0.0]
    - [ 0.0,   -2.375,  0.0]
    - [-2.0,   -2.375,  0.0]
    - [-3.6,   -2.375,  0.0]


    # ----------------------------------------------------------
    # Row 3: y = -1.750
    # Left -> Right
    # ----------------------------------------------------------

    - [-3.6,   -1.750,  0.0]
    - [-2.0,   -1.750,  0.0]
    - [ 0.0,   -1.750,  0.0]
    - [ 2.0,   -1.750,  0.0]
    - [ 3.6,   -1.750,  0.0]


    # ----------------------------------------------------------
    # Row 4: y = -1.125
    # Right -> Left
    # ----------------------------------------------------------

    - [ 3.6,   -1.125,  0.0]
    - [ 2.0,   -1.125,  0.0]
    - [ 0.0,   -1.125,  0.0]
    - [-2.0,   -1.125,  0.0]
    - [-3.6,   -1.125,  0.0]


    # ----------------------------------------------------------
    # Row 5: y = -0.500
    # Left -> Right
    # ----------------------------------------------------------

    - [-3.6,   -0.500,  0.0]
    - [-2.0,   -0.500,  0.0]
    - [ 0.0,   -0.500,  0.0]
    - [ 2.0,   -0.500,  0.0]
    - [ 3.6,   -0.500,  0.0]


    # ----------------------------------------------------------
    # Row 6: y = 0.125
    # Right -> Left
    # ----------------------------------------------------------

    - [ 3.6,    0.125,  0.0]
    - [ 2.0,    0.125,  0.0]
    - [ 0.0,    0.125,  0.0]
    - [-2.0,    0.125,  0.0]
    - [-3.6,    0.125,  0.0]


    # ----------------------------------------------------------
    # Row 7: y = 0.750
    # Left -> Right
    # ----------------------------------------------------------

    - [-3.6,    0.750,  0.0]
    - [-2.0,    0.750,  0.0]
    - [ 0.0,    0.750,  0.0]
    - [ 2.0,    0.750,  0.0]
    - [ 3.6,    0.750,  0.0]


    # ----------------------------------------------------------
    # Row 8: y = 1.375
    # Right -> Left
    # ----------------------------------------------------------

    - [ 3.6,    1.375,  0.0]
    - [ 2.0,    1.375,  0.0]
    - [ 0.0,    1.375,  0.0]
    - [-2.0,    1.375,  0.0]
    - [-3.6,    1.375,  0.0]


    # ----------------------------------------------------------
    # Row 9: y = 2.000
    # Left -> Right
    # ----------------------------------------------------------

    - [-3.6,    2.000,  0.0]
    - [-2.0,    2.000,  0.0]
    - [ 0.0,    2.000,  0.0]
    - [ 2.0,    2.000,  0.0]
    - [ 3.6,    2.000,  0.0]


    # ----------------------------------------------------------
    # Final return
    # ----------------------------------------------------------

    - [ 0.0,    0.0,    0.0]